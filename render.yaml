services:
  - type: web
    name: code2-calender
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    disks:
      - name: code2-calender-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_FILE
        value: /var/data/trades.json
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CLOUDINARY_URL
        sync: false   # Set this secret in the Render dashboard → Environment

  - type: static
    name: tradefeed
    buildCommand: cd tradefeed && npm install && npm run build
    staticPublishPath: tradefeed/dist
    envVars:
      - key: VITE_API_URL
        value: https://code2-calender.onrender.com
