<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Lab | Trading Journal</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .lab-container { display: flex; height: 100vh; overflow: hidden; background: #f6f8fa; }
        .lab-sidebar { width: 300px; background: white; border-right: 1px solid #d0d7de; padding: 20px; overflow-y: auto; flex-shrink: 0; position: relative; }
        .lab-sidebar.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
        .sidebar-toggle-btn { position: absolute; left: 300px; top: 50%; transform: translateY(-50%); background: white; border: 1px solid #d0d7de; border-left: none; width: 20px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1500; border-radius: 0 8px 8px 0; transition: left 0.3s ease; font-size: 0.7rem; color: #666; }
        .lab-sidebar.collapsed + .sidebar-toggle-btn { left: 0; }
        .lab-main { flex: 1; position: relative; background: #ffffff; display: flex; flex-direction: column; }
        .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; font-weight: 600; color: #0969da; }
        .nav-controls { display: flex; align-items: center; gap: 12px; padding:10px; border-bottom:1px solid #d0d7de; background:#f6f8fa; }
        .nav-btn { padding: 6px 15px; border: 1px solid #d0d7de; background: white; border-radius: 6px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; transition: all 0.2s;}
        .nav-btn:hover { background: #f6f8fa; border-color: #0969da; color: #0969da; }
        .chart-wrapper { flex: 1; position: relative; padding: 10px; }
        #chart-container { width: 100%; height: 100%; }
        .setting-item { display: block; margin-bottom: 12px; font-size: 0.85rem; color: #1f2328; font-weight: 600; }
        .lab-btn { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .lab-btn-primary { background: #0969da; color: white; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: #ffffff; padding: 25px; border-radius: 12px; width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal-title { font-size: 1.1rem; font-weight: 600; }
        .close-modal { cursor: pointer; font-size: 1.5rem; color: #666; }
        .toggle-group { margin-bottom: 15px; padding: 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
        .toggle-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="lab-container">
        <div class="lab-sidebar" id="sidebar">
            <h3 style="margin:0 0 20px 0; font-size: 1.1rem; border-bottom:1px solid #eee; padding-bottom:10px;">Configuration</h3>
            
            <div style="margin-bottom:20px;"><label class="setting-item">SYMBOL</label><input type="text" class="nav-btn" style="width:100%;" value="Nifty 50 (^NSEI)" readonly></div>
            <div style="margin-bottom:20px;">
                <label class="setting-item">DATA SOURCE</label>
                <select id="source-select" class="nav-btn" style="width:100%;">
                    <option value="yfinance">yfinance (Free)</option>
                    <option value="dhan_api">Dhan API (Live)</option>
                    <option value="dhan_local">Dhan Local (CSV)</option>
                </select>
            </div>
            
            <div style="margin-bottom:20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <label class="setting-item" style="margin:0;">STRATEGY</label>
                </div>
                <select id="strategy-select" class="nav-btn" style="width:100%;"><option>Arsalan Continuation</option></select>
                
                <!-- Strategy Internal Logic Toggles (Pine Script Port) -->
                <div class="toggle-group" style="margin-top:10px;">
                    <div style="font-size:0.7rem; color:#64748b; font-weight:700; margin-bottom:8px; text-transform:uppercase;">Strategy Logic (Pine)</div>
                    <label class="toggle-item"><input type="checkbox" id="use-fresh-zone" checked> Use Fresh Zone Only</label>
                    <label class="toggle-item"><input type="checkbox" id="fib-exit" checked> SL Below Fib</label>
                    <label class="toggle-item"><input type="checkbox" id="zone-exit" checked> Zone Exit</label>
                    <label class="toggle-item"><input type="checkbox" id="atr-exit" checked> Atr Exit</label>
                </div>
            </div>

            <div style="margin-bottom:20px;"><label class="setting-item">TIMEFRAME</label><select id="timeframe-select" class="nav-btn" style="width:100%;"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option></select></div>
            <div style="margin-bottom:20px;"><label class="setting-item">DATE RANGE</label><div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><input type="date" id="start-date" class="nav-btn"><input type="date" id="end-date" class="nav-btn"></div></div>
            <div style="margin-bottom:30px;"><label class="setting-item">MARKET TIME</label><div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><input type="time" id="start-time" class="nav-btn" value="09:15"><input type="time" id="end-time" class="nav-btn" value="15:30"></div></div>
            <button class="lab-btn lab-btn-primary" id="run-btn">Run Strategy</button>
        </div>
        <div class="sidebar-toggle-btn" id="sidebar-toggle-btn">◀</div>
        <main class="lab-main">
            <div class="loading-overlay" id="loader">Running Strategy...</div>
            <div class="nav-controls">
                <button class="nav-btn" id="prev-day-btn">◀</button><button class="nav-btn" id="fit-btn" style="font-weight:600;">FIT VIEW</button><button class="nav-btn" id="next-day-btn">▶</button>
                <div style="margin-left:auto; display:flex; gap:10px;">
                    <button class="nav-btn" id="open-trades-modal-btn" style="border-color:#f9a825; color:#f9a825; font-weight:600;">REAL TRADES</button>
                    <button class="nav-btn" id="batch-export-btn">Batch Export</button>
                    <a href="/" class="nav-btn" style="text-decoration:none;">Home</a>
                </div>
            </div>
            <div class="chart-wrapper"><div id="chart-container"></div></div>
        </main>
    </div>

    <!-- Dhan Credentials Modal -->
    <div class="modal-overlay" id="dhan-auth-modal">
        <div class="modal-content" style="width: 400px;">
            <div class="modal-header">
                <div class="modal-title">Dhan API Credentials</div>
                <div class="close-modal" id="close-dhan-modal">&times;</div>
            </div>
            <div style="padding: 10px 0;">
                <p style="font-size: 0.8rem; color: #666; margin-bottom: 15px;">Credentials are saved for this session only.</p>
                <div style="margin-bottom:15px;">
                    <label class="setting-item">CLIENT ID</label>
                    <input type="text" id="dhan-client-id" class="nav-btn" style="width:100%;" placeholder="e.g. 1101xxxx">
                </div>
                <div style="margin-bottom:20px;">
                    <label class="setting-item">ACCESS TOKEN (JWT)</label>
                    <textarea id="dhan-access-token" class="nav-btn" style="width:100%; height:80px; font-size: 0.7rem;" placeholder="Paste your JWT token here..."></textarea>
                </div>
                <button class="lab-btn lab-btn-primary" id="save-dhan-btn">Save & Continue</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="trades-modal"><div class="modal-content" style="width: 500px; max-height: 80vh; overflow-y: auto;"><div class="modal-header"><div class="modal-title">Real Trades Found</div><div class="close-modal" id="close-trades-modal-btn">&times;</div></div><div id="trades-list-container"></div></div></div>

    <script src="/static/js/vendor/lightweight-charts.standalone.production.js"></script>
    <script>
        let chart, candleSeries, ema10Series, ema20Series, demaSeries, markerSeries;
        let zoneSeriesList = [];
        let realTradeSeriesList = [];
        let currentChartData = [];
        let loadedRealTrades = [];

        const endDay = new Date();
        const startDay = new Date();
        startDay.setDate(startDay.getDate() - 7);
        document.getElementById('end-date').value = endDay.toISOString().split('T')[0];
        document.getElementById('start-date').value = startDay.toISOString().split('T')[0];

        function initChart() {
            const container = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { color: '#ffffff' }, textColor: '#333' },
                grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
                timeScale: { timeVisible: true }
            });

            candleSeries = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350' });
            ema10Series = chart.addLineSeries({ color: '#2196F3', lineWidth: 1, title: 'EMA 10' });
            ema20Series = chart.addLineSeries({ color: '#F44336', lineWidth: 1, title: 'EMA 20' });
            demaSeries = chart.addLineSeries({ color: '#424242', lineWidth: 2, title: 'DEMA 100' });
            markerSeries = chart.addLineSeries({ color: 'transparent', lineWidth: 0, priceLineVisible: false, lastValueVisible: false });

            window.addEventListener('resize', () => { chart.applyOptions({ width: container.clientWidth, height: container.clientHeight }); });
        }

        function clearZones() { zoneSeriesList.forEach(s => chart.removeSeries(s)); zoneSeriesList = []; }
        function clearRealTrades() { realTradeSeriesList.forEach(s => chart.removeSeries(s)); realTradeSeriesList = []; }

        function checkDhanAuth() {
            const source = document.getElementById('source-select').value;
            const savedToken = sessionStorage.getItem('dhan_access_token');
            if (source === 'dhan_api' && !savedToken) {
                document.getElementById('dhan-auth-modal').style.display = 'flex';
            }
        }

        document.getElementById('source-select').onchange = checkDhanAuth;
        document.getElementById('close-dhan-modal').onclick = () => document.getElementById('dhan-auth-modal').style.display = 'none';
        document.getElementById('save-dhan-btn').onclick = () => {
            const cid = document.getElementById('dhan-client-id').value;
            const token = document.getElementById('dhan-access-token').value;
            if (cid && token) {
                sessionStorage.setItem('dhan_client_id', cid);
                sessionStorage.setItem('dhan_access_token', token);
                document.getElementById('dhan-auth-modal').style.display = 'none';
                runStrategy();
            } else {
                alert('Please provide both Client ID and Token');
            }
        };

        // Load existing session creds into fields
        document.getElementById('dhan-client-id').value = sessionStorage.getItem('dhan_client_id') || '';
        document.getElementById('dhan-access-token').value = sessionStorage.getItem('dhan_access_token') || '';

        async function runStrategy(silent = false) {
            const loader = document.getElementById('loader');
            if (!silent) loader.style.display = 'flex';
            
            try {
                const params = new URLSearchParams({
                    start_date: document.getElementById('start-date').value,
                    end_date: document.getElementById('end-date').value,
                    timeframe: document.getElementById('timeframe-select').value,
                    fresh_zone: document.getElementById('use-fresh-zone').checked,
                    fib_exit: document.getElementById('fib-exit').checked,
                    zone_exit: document.getElementById('zone-exit').checked,
                    atr_exit: document.getElementById('atr-exit').checked,
                    start_time: document.getElementById('start-time').value,
                    end_time: document.getElementById('end-time').value,
                    source: document.getElementById('source-select').value,
                    dhan_cid: sessionStorage.getItem('dhan_client_id') || '',
                    dhan_token: sessionStorage.getItem('dhan_access_token') || ''
                });

                const res = await fetch(`/api/strategy/nifty-data?${params.toString()}`);
                const dataRaw = await res.json();
                if (dataRaw.error) { if (!silent) alert(dataRaw.error); return false; }

                clearZones();
                clearRealTrades();
                markerSeries.setMarkers([]);

                currentChartData = dataRaw.chart_data;
                const zones = dataRaw.zones;
                const realTrades = dataRaw.real_trades || [];
                loadedRealTrades = realTrades;

                const visibleData = currentChartData.filter(d => !d.is_gap);
                if (!visibleData.length) return false;

                candleSeries.setData(visibleData.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
                ema10Series.setData(currentChartData.map(d => ({ time: d.time, value: d.ema10 === null ? undefined : d.ema10 })));
                ema20Series.setData(currentChartData.map(d => ({ time: d.time, value: d.ema20 === null ? undefined : d.ema20 })));
                demaSeries.setData(currentChartData.map(d => ({ time: d.time, value: d.dema100 === null ? undefined : d.dema100 })));
                markerSeries.setData(visibleData.map(d => ({ time: d.time, value: d.close })));

                const zoneMarkers = [];
                zones.forEach(zone => {
                    const zoneTimes = currentChartData.map(d => d.time).filter(t => t >= zone.start_time && t <= zone.end_time);
                    if (zoneTimes.length < 2) return;
                    const color = zone.type === 'bull' ? 'rgba(38, 166, 154, 0.4)' : 'rgba(128, 0, 0, 0.4)';
                    const u = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
                    const l = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
                    u.setData(zoneTimes.map(t => ({ time: t, value: zone.high })));
                    l.setData(zoneTimes.map(t => ({ time: t, value: zone.low })));
                    zoneSeriesList.push(u, l);
                    const lastVisible = visibleData.filter(d => d.time <= zoneTimes[zoneTimes.length-1]).pop();
                    if (lastVisible) zoneMarkers.push({ time: lastVisible.time, position: 'inBar', color, shape: 'circle', text: `[${Math.round(zone.size)}]` });
                });

                const realTradeMarkers = [];
                realTrades.forEach(rt => {
                    const ep = visibleData.find(d => d.time >= rt.entry_time);
                    if (!ep) return;
                    const duration = Math.round((rt.exit_time - rt.entry_time) / 60);
                    const color = rt.pl > 0 ? '#26a69a' : '#ef5350';
                    let instClean = rt.instrument;
                    const instMatch = instClean.match(/(\d{4,5})\s*([CP]E)/);
                    if (instMatch) instClean = instMatch[1] + " " + instMatch[2];
                    else instClean = instClean.split(' ').pop();
                    const line = chart.addLineSeries({ color, lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
                    line.setData([{ time: ep.time, value: ep.open }, { time: Math.max(ep.time + 300, rt.exit_time), value: ep.open }]);
                    realTradeSeriesList.push(line);
                    
                    // Direction based on CE/PE
                    const isPE = instClean.includes('PE');
                    const position = isPE ? 'belowBar' : 'aboveBar';
                    const shape = isPE ? 'arrowUp' : 'arrowDown';
                    
                    realTradeMarkers.push({
                        time: ep.time,
                        position: position,
                        color: '#f9a825', 
                        shape: shape,
                        size: 2,
                        text: `${instClean} [${duration}m] ${rt.qty}L (₹${Math.round(rt.pl)})`
                    });
                });

                setTimeout(() => { markerSeries.setMarkers([...zoneMarkers, ...realTradeMarkers].sort((a,b) => a.time - b.time)); }, 50);
                chart.timeScale().fitContent();
                return true;
            } catch (e) { console.error(e); return false; }
            finally { loader.style.display = 'none'; }
        }

        function jumpToTrade(t) {
            document.getElementById('trades-modal').style.display = 'none';
            chart.timeScale().setVisibleRange({ from: t - 1800, to: t + 1800 });
        }

        function openTradesModal() {
            const container = document.getElementById('trades-list-container');
            document.getElementById('trades-modal').style.display = 'flex';
            container.innerHTML = loadedRealTrades.length ? loadedRealTrades.map(t => `
                <div style="padding:10px; border:1px solid #eee; border-radius:8px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <div><div style="font-weight:600;">${t.instrument}</div><div style="font-size:0.8rem; color:#666;">Time: ${new Date(t.entry_time * 1000).toISOString().replace('T',' ').substring(0, 19)}</div></div>
                    <button class="nav-btn" onclick="jumpToTrade(${t.entry_time})">GOTO</button>
                </div>
            `).join('') : '<div style="text-align:center; padding:20px; color:#999;">No trades.</div>';
        }

        document.getElementById('close-trades-modal-btn').onclick = () => document.getElementById('trades-modal').style.display = 'none';
        document.getElementById('open-trades-modal-btn').onclick = openTradesModal;
        document.getElementById('run-btn').onclick = () => runStrategy();
        document.getElementById('prev-day-btn').onclick = () => { const d = new Date(document.getElementById('start-date').value); d.setDate(d.getDate()-1); document.getElementById('start-date').value = d.toISOString().split('T')[0]; runStrategy(); };
        document.getElementById('next-day-btn').onclick = () => { const d = new Date(document.getElementById('start-date').value); d.setDate(d.getDate()+1); document.getElementById('start-date').value = d.toISOString().split('T')[0]; runStrategy(); };
        document.getElementById('fit-btn').onclick = () => chart.timeScale().fitContent();
        document.getElementById('sidebar-toggle-btn').onclick = () => { const sb = document.getElementById('sidebar'); sb.classList.toggle('collapsed'); document.getElementById('sidebar-toggle-btn').innerText = sb.classList.contains('collapsed') ? '▶' : '◀'; setTimeout(() => chart.applyOptions({ width: document.getElementById('chart-container').clientWidth }), 300); };

        initChart();
        runStrategy();
    </script>
</body>
</html>
