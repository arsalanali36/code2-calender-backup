                    background: chartView === v ? 'var(--accent-blue)' : 'transparent',
                    color: chartView === v ? '#fff' : 'var(--text-muted)', transition: 'all 0.15s' }}>
                  {v === 'single' ? '▣ Single' : '⧉ Dual'}
                </button>
              ))}
            </div>
            <button onClick={() => setFullscreenChart(null)}
              style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, fontWeight: 600, padding: '5px 14px', borderRadius: 7, background: 'var(--bg-card)', border: '1px solid var(--border)', color: 'var(--text-secondary)', cursor: 'pointer' }}>
              <Icon name="close" size={13} /> Exit Fullscreen
            </button>
          </div>
          {/* Fullscreen chart body */}
          <div style={{ flex: 1, padding: 12, overflow: 'hidden' }}>
            {chartView === 'dual' ? (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, height: '100%' }}>
                <ChartPlaceholder title="NIFTY 50 (INDEX)" style={{ height: '100%' }} onFullscreen={() => setFullscreenChart('index')} />
                <ChartPlaceholder title="NIFTY26APR24100CE" style={{ height: '100%' }} onFullscreen={() => setFullscreenChart('option')} />
              </div>
            ) : (
              <ChartPlaceholder
                title={fullscreenChart === 'index' ? 'NIFTY 50 (INDEX)' : 'NIFTY26APR24100CE'}
                style={{ height: '100%' }}
                onFullscreen={() => setFullscreenChart(null)}
              />
            )}
          </div>
        </div>
      )}



      <style>{`
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
        }
        button:hover { opacity: 0.9; }
        select, input { color-scheme: dark; }
        [data-theme="light"] select, [data-theme="light"] input { color-scheme: light; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
